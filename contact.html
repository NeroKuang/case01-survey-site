<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>後續訪談聯絡方式</title><link rel="stylesheet" href="./styles.css"></head><body><div class="site-shell"><header class="topbar"><div class="brand"><span class="brand-mark">FOLLOW-UP</span><span class="brand-copy">Interview contact</span></div></header><main><section class="card hero"><div class="eyebrow">Optional follow-up</div><h1>願意再聊 10–15 分鐘嗎？</h1><p class="lead">這個頁面的資料會存到另一張表，不會和前一份匿名問卷回答進行技術上的直接綁定。</p><form id="contactForm"><fieldset><legend>你希望用什麼方式聯絡？</legend><div class="option-grid"><label class="option"><input type="radio" name="channel" value="instagram"><span>Instagram</span></label><label class="option"><input type="radio" name="channel" value="email"><span>Email</span></label><label class="option"><input type="radio" name="channel" value="line"><span>LINE</span></label><label class="option"><input type="radio" name="channel" value="other"><span>其他</span></label></div></fieldset><fieldset><legend>聯絡帳號／Email</legend><input name="contact" class="inline-input" type="text" placeholder="@your_account / you@example.com"></fieldset><fieldset><legend>最常參與哪類活動 <span class="hint">選填</span></legend><textarea name="note" rows="3" maxlength="300" placeholder="例如：主要跑台北女僕店、偶爾去地偶 Live"></textarea></fieldset><button class="primary-btn" type="submit">送出聯絡方式</button></form><div id="contactSuccess" class="success-card hidden"><div class="success-mark">✓</div><h2>已收到</h2><p>謝謝你願意接受後續訪談。</p></div><div id="contactError" class="error-card hidden"><p id="contactErrorText"></p></div></section></main></div><script src="./config.js"></script><script src="./contact.js"></script></body></html>
